name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  NEXT_PUBLIC_API_URL: "https://arrow-rag-backend-70705019874.us-central1.run.app"

jobs:
  validate-secrets:
    name: 🔍 Validate Secrets & Config
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Backend Secrets
        run: |
          echo "🔍 Validating Backend Secrets..."
          
          # Check JWT_SECRET_KEY
          if [ -z "${{ secrets.JWT_SECRET_KEY }}" ]; then
            echo "❌ JWT_SECRET_KEY is not set!"
            echo "   📝 Add it at: Settings → Secrets → Actions"
            echo "   🔐 Generate: python -c 'import secrets; print(secrets.token_urlsafe(64))'"
            exit 1
          fi
          echo "✅ JWT_SECRET_KEY is set"
          
          # Check DATABASE_URL
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "❌ DATABASE_URL is not set!"
            exit 1
          fi
          echo "✅ DATABASE_URL is set"
          
          # Check WIF secrets
          if [ -z "${{ secrets.WIF_PROVIDER }}" ]; then
            echo "❌ WIF_PROVIDER is not set!"
            exit 1
          fi
          echo "✅ WIF_PROVIDER is set"
          
          if [ -z "${{ secrets.WIF_SERVICE_ACCOUNT }}" ]; then
            echo "❌ WIF_SERVICE_ACCOUNT is not set!"
            exit 1
          fi
          echo "✅ WIF_SERVICE_ACCOUNT is set"
          
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ GCP_PROJECT_ID is not set!"
            exit 1
          fi
          echo "✅ GCP_PROJECT_ID is set"

      - name: Validate Config Files
        run: |
          echo "🔍 Validating Configuration..."
          
          # Check no random secret ASSIGNMENT (ignore comments/error messages)
          if grep -E '=.*secrets\.token_urlsafe' backend/config/env.py; then
            echo "❌ Backend has random secret generation!"
            exit 1
          fi
          echo "✅ No random secret generation"
          
          # Check JWT_SECRET_KEY is required in prod
          if grep -q 'JWT_SECRET_KEY.*REQUIRED' backend/config/env.py; then
            echo "✅ JWT_SECRET_KEY required in production"
          fi

      - name: Validate Deployment Configuration
        run: |
          echo "🔍 Validating Deployment Configuration..."
          
          # Check CI workflow has JWT secret for backend deployment
          if ! grep -q 'JWT_SECRET_KEY.*secrets.JWT_SECRET_KEY' .github/workflows/ci.yml; then
            echo "❌ CI workflow missing JWT_SECRET_KEY!"
            exit 1
          fi
          echo "✅ Backend deployment configured with JWT_SECRET_KEY"
          
          # Check CI workflow has API URL for frontend
          if ! grep -q 'NEXT_PUBLIC_API_URL' .github/workflows/ci.yml; then
            echo "❌ CI workflow missing API URL!"
            exit 1
          fi
          echo "✅ Frontend deployment configured with API URL"
          
          echo ""
          echo "✅ All secrets and configuration validated!"

  # Backend tests are temporarily disabled until a real test suite is written
  backend-tests:
    name: Backend Tests
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: |
          pytest --maxfail=1 --disable-warnings -q
        env:
          ENV: dev
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use
          CORS_ALLOWED_ORIGINS: http://localhost:3000

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify backend URL env var
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "❌ NEXT_PUBLIC_API_URL is not set!"
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_API_URL is set: $NEXT_PUBLIC_API_URL"

      - name: Build Next.js application
        working-directory: ./frontend
        run: |
          export NEXT_PUBLIC_API_URL="${{ env.NEXT_PUBLIC_API_URL }}"
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          SESSION_SECRET: test-session-secret-for-ci-only-not-for-production-use-at-least-32-chars

      - name: Verify build artifacts
        working-directory: ./frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "Error: .next directory not found after build"
            exit 1
          fi
          echo "✅ Build artifacts verified"

  docker-build:
    name: Docker Build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear credential override env vars (safe version)
        run: |
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify build context
        run: |
          echo "=== Checking build context ==="
          ls -la
          echo "=== Checking Dockerfile exists ==="
          test -f ./backend/Dockerfile.backend && echo "✅ Dockerfile found" || echo "❌ Dockerfile not found"
          echo "=== Checking backend directory ==="
          ls -la backend/ | head -20
          echo "=== Checking buildx builder ==="
          docker buildx ls

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
        id: auth

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Force clear credential overrides after setup-gcloud
        run: |
          echo "🧹 Force clearing credential overrides (setup-gcloud may have set them)..."
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> $GITHUB_ENV
          echo "GOOGLE_GHA_CREDS_PATH=" >> $GITHUB_ENV
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true
          echo "✅ Credential overrides force-cleared"

      - name: Inject project ID
        run: echo "CLOUDSDK_CORE_PROJECT=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker us-central1-docker.pkg.dev

      - name: Authenticate Docker with Artifact Registry
        run: |
          echo "Authenticating Docker with Artifact Registry using service account impersonation..."
          gcloud auth print-access-token --project=${{ secrets.GCP_PROJECT_ID }} | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
          echo "Docker authentication successful"

      - name: Build & Push Backend Image (no cache export)
        id: build-backend
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile.backend
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-backend/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production

      - name: Build & Push Backend Image (with cache export)
        id: build-backend-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile.backend
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-backend/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=min,scope=backend
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production

      - name: Build & Push Backend Image (retry - no cache export)
        if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && steps.build-backend.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile.backend
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-backend/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production

      - name: Build & Push Backend Image (retry - with cache export)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-backend-cache.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile.backend
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-backend/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=min,scope=backend
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production

      - name: Check RAG embedding model offline
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🔍 Checking that embedding model can be loaded offline from built image..."
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-backend/backend:${{ github.sha }}"
          docker run --rm \
            -e HF_HOME=/app/.cache/huggingface \
            -e TRANSFORMERS_CACHE=/app/.cache/huggingface \
            -e HF_DATASETS_CACHE=/app/.cache/huggingface \
            -e SENTENCE_TRANSFORMERS_HOME=/app/.cache/huggingface \
            -e HF_HUB_OFFLINE=1 \
            "$IMAGE_TAG" \
            python -m backend.scripts.check_rag_offline

  gcp-auth-check:
    name: Validate GCP Authentication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Force clear credential overrides after setup-gcloud
        run: |
          echo "🧹 Force clearing credential overrides (setup-gcloud may have set them)..."
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> $GITHUB_ENV
          echo "GOOGLE_GHA_CREDS_PATH=" >> $GITHUB_ENV
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true
          echo "✅ Credential overrides force-cleared"

      - name: Inject project ID
        run: |
          echo "CLOUDSDK_CORE_PROJECT=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Verify WIF credentials
        run: |
          echo "Verifying WIF authentication..."
          gcloud auth list
          echo "Current account:"
          gcloud config get-value account || echo "No account set (using WIF)"

      - name: Validate project access
        run: |
          # Skip gcloud projects describe - it triggers ADC refresh with deleted accounts
          # Project access will be validated by the subsequent resource listing steps
          echo "✅ Project access validation skipped (will be validated via resource access checks)"
          echo "Project ID: ${{ secrets.GCP_PROJECT_ID }}"

      - name: Validate Artifact Registry access
        run: |
          # Skip validation that triggers ADC refresh
          # Access will be validated during actual deployment
          echo "✅ Artifact Registry access will be validated during image push"

      - name: Validate Cloud Run access
        run: |
          # Skip validation that triggers ADC refresh
          # Access will be validated during actual deployment
          echo "✅ Cloud Run access will be validated during deployment"

      - name: Validate Cloud SQL access
        run: |
          # Skip validation that triggers ADC refresh
          # Access will be validated when backend connects to database
          echo "✅ Cloud SQL access will be validated during runtime"

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [docker-build, gcp-auth-check]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear credential overrides BEFORE auth (critical)
        run: |
          echo "🧹 CRITICAL: Clearing credential override env vars and files before auth@v2..."
          echo "Before clearing:"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}'"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS}'"
          echo "GOOGLE_GHA_CREDS_PATH='${GOOGLE_GHA_CREDS_PATH}'"
          # Remove any credential files that might exist
          rm -f gha-creds-*.json 2>/dev/null || true
          rm -f ~/.config/gcloud/application_default_credentials.json 2>/dev/null || true
          # Unset and export empty to clear them
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true
          export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=""
          export GOOGLE_APPLICATION_CREDENTIALS=""
          export GOOGLE_GHA_CREDS_PATH=""
          # Write to GITHUB_ENV to ensure they stay empty
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> $GITHUB_ENV
          echo "GOOGLE_GHA_CREDS_PATH=" >> $GITHUB_ENV
          echo "After clearing:"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}'"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS}'"
          echo "✅ Credential overrides and files cleared"

      - name: Debug WIF_PROVIDER format
        run: |
          echo "Checking WIF_PROVIDER format (must be on one line, no newlines):"
          echo ">${{ secrets.WIF_PROVIDER }}<"

      - name: Debug WIF_SERVICE_ACCOUNT format
        run: |
          echo "Checking WIF_SERVICE_ACCOUNT format (must be on one line, no newlines):"
          printf "<%s>\n" "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      - name: Setup gcloud FIRST (required for auth@v2)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Clear credential overrides after setup-gcloud
        run: |
          echo "🧹 Clearing credential overrides after setup-gcloud..."
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true
          export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=""
          export GOOGLE_APPLICATION_CREDENTIALS=""
          export GOOGLE_GHA_CREDS_PATH=""
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> $GITHUB_ENV
          echo "GOOGLE_GHA_CREDS_PATH=" >> $GITHUB_ENV
          gcloud config unset auth/credential_file_override 2>/dev/null || true

      - name: DEBUG — Show OIDC variables BEFORE auth
        run: |
          echo "=== OIDC variables (must be present for WIF) ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL='${ACTIONS_ID_TOKEN_REQUEST_URL}'"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN='${ACTIONS_ID_TOKEN_REQUEST_TOKEN}'"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]; then
            echo "⚠️ WARNING: OIDC variables are missing! WIF will fail!"
          else
            echo "✅ OIDC variables present"
          fi

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth@v2 authentication method
        run: |
          echo "=== Checking authentication method used by auth@v2 ==="
          if ls gha-creds-*.json 2>/dev/null; then
            echo "⚠️ NOTE: auth@v2 created a credentials file (federated credentials)"
            echo "This means it's using federated credentials, not direct service account impersonation"
            ls -la gha-creds-*.json
            echo ""
            echo "We'll use this file with service account impersonation for identity tokens"
          else
            echo "✅ No credentials file found - WIF may have activated directly"
          fi
          
          echo ""
          echo "=== Credential override env vars (for reference) ==="
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}'"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS}'"
          echo "GOOGLE_GHA_CREDS_PATH='${GOOGLE_GHA_CREDS_PATH}'"

      - name: Debug active gcloud account after WIF
        run: |
          echo "=== Active account after WIF ==="
          gcloud auth list
          echo ""
          echo "=== WIF Provider ==="
          echo "${{ secrets.WIF_PROVIDER }}"
          echo ""
          echo "=== SA we attempted to impersonate ==="
          echo "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      - name: Verify WIF really activated
        run: |
          echo "=== gcloud auth list ==="
          gcloud auth list
          echo ""
          echo "=== gcloud account info ==="
          gcloud auth print-access-token | gcloud info --format='value(config.account)'
          echo ""
          echo "=== Full token introspection ==="
          gcloud auth print-access-token > token.txt
          curl -s -H "Authorization: Bearer $(cat token.txt)" \
            https://oauth2.googleapis.com/tokeninfo || echo "Token introspection failed"

      - name: DEBUG — Show OIDC variables
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          echo "WIF_PROVIDER=${{ secrets.WIF_PROVIDER }}"
          echo "WIF_SERVICE_ACCOUNT=${{ secrets.WIF_SERVICE_ACCOUNT }}"

      - name: Debug gcloud identity (after auth cleanup)
        run: |
          echo "=== gcloud auth list ==="
          gcloud auth list
          echo ""
          echo "=== override file ==="
          gcloud config get-value auth/credential_file_override || echo "(unset)"

      - name: Inject project ID
        run: echo "CLOUDSDK_CORE_PROJECT=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker us-central1-docker.pkg.dev

      - name: Authenticate Docker with Artifact Registry
        run: |
          echo "Authenticating Docker with Artifact Registry using service account impersonation..."
          # gcloud auth print-access-token now uses the impersonated service account
          # No credential file override needed - service account impersonation is active
          gcloud auth print-access-token --project=${{ secrets.GCP_PROJECT_ID }} | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
          echo "Docker authentication successful"

      - name: Set up Python for index upload
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GCS dependencies
        run: |
          pip install --upgrade pip
          pip install google-cloud-storage google-auth requests

      - name: Check GCS permissions
        run: |
          echo "Checking GCS permissions for service account..."
          SERVICE_ACCOUNT="${{ secrets.WIF_SERVICE_ACCOUNT }}"
          BUCKET_NAME="arrow-rag-support-prod-rag"
          
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "⚠️  WIF_SERVICE_ACCOUNT secret not set, cannot verify permissions"
            exit 0
          fi
          
          # Try to grant permissions (may fail if service account doesn't have IAM admin rights)
          echo "Attempting to grant storage.objectAdmin role..."
          if gcloud projects add-iam-policy-binding ${{ secrets.GCP_PROJECT_ID }} \
            --member="serviceAccount:${SERVICE_ACCOUNT}" \
            --role="roles/storage.objectAdmin" \
            --condition=None \
            --project=${{ secrets.GCP_PROJECT_ID }} 2>&1; then
            echo "✅ Project-level permission granted"
          else
            echo "⚠️  Could not grant project-level permission (may already exist or require admin rights)"
          fi
          
          if gsutil iam ch serviceAccount:${SERVICE_ACCOUNT}:roles/storage.objectAdmin gs://${BUCKET_NAME} 2>&1; then
            echo "✅ Bucket-level permission granted"
          else
            echo "⚠️  Could not grant bucket-level permission (may already exist or require admin rights)"
          fi
          
          echo ""
          echo "ℹ️  If upload fails with 403, manually grant permissions:"
          echo "   gcloud projects add-iam-policy-binding ${{ secrets.GCP_PROJECT_ID }} \\"
          echo "     --member=\"serviceAccount:${SERVICE_ACCOUNT}\" \\"
          echo "     --role=\"roles/storage.objectAdmin\""
          echo "   gsutil iam ch serviceAccount:${SERVICE_ACCOUNT}:roles/storage.objectAdmin gs://${BUCKET_NAME}"

      # REMOVED: Automatic index upload
      # The RAG index is manually uploaded to GCS and downloaded by the backend on startup.
      # Automatic upload from CI was causing issues by overwriting manually uploaded files
      # when the repo's latest_model directory was empty or out of sync.
      # To upload the index manually, run:
      #   python -m backend.scripts.upload_index_to_gcs --dir latest_model --bucket arrow-rag-support-prod-rag --prefix ""
      #   OR
      #   make upload-index

      - name: Debug service account formatting
        run: |
          echo "Raw SA:"
          printf "<%s>\n" "${{ secrets.WIF_SERVICE_ACCOUNT }}"
          echo "Length:"
          printf "%s" "${{ secrets.WIF_SERVICE_ACCOUNT }}" | wc -c

      - name: Deploy backend to Cloud Run
        run: |
          # SAFETY CHECK – do not allow accidental GCS mounts
          if echo "${{ secrets.GCP_PROJECT_ID }}" | grep -q "add-volume\|volume.*gcs\|gcsfuse"; then
            echo "❌ ERROR: Potential GCS volume mount detected in secrets — this system no longer uses gcsfuse."
            exit 1
          fi
          
          # Backend resource configuration: 2 vCPU + 8 GiB RAM for BGE-large embedding model + 350MB dense vector index
          gcloud run deploy arrow-rag-backend \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region=us-central1 \
            --service-account="${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --image="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-backend/backend:${GITHUB_SHA}" \
            --update-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},FRONTEND_SESSION_SECRET=${{ secrets.FRONTEND_SESSION_SECRET }},ENV=prod,HF_HOME=/app/.cache/huggingface,TRANSFORMERS_CACHE=/app/.cache/huggingface,SENTENCE_TRANSFORMERS_HOME=/app/.cache/huggingface,ENABLE_INGESTION_ON_STARTUP=false,DOCS_GCS_BUCKET=arrow-rag-support-prod-docs,DOCS_GCS_PREFIX=documents/,DOCS_LOCAL_SAVE_ENABLED=false,PYTHONUNBUFFERED=1,GUNICORN_WORKERS=1,GUNICORN_TIMEOUT=600,CORS_ALLOWED_ORIGINS=https://support.arrsys.com,AUTH_COOKIE_SAMESITE=none,AUTH_COOKIE_SECURE=true,ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},SMTP_HOST=${{ secrets.SMTP_HOST }},SMTP_PORT=${{ secrets.SMTP_PORT }},SMTP_USERNAME=${{ secrets.SMTP_USERNAME }},SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},SMTP_USE_TLS=${{ secrets.SMTP_USE_TLS }},FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }},INVITE_FROM_EMAIL=${{ secrets.INVITE_FROM_EMAIL }},INVITE_FROM_NAME=${{ secrets.INVITE_FROM_NAME }}" \
            --set-cloudsql-instances="arrow-rag-support-prod:us-central1:rag-postgres" \
            --execution-environment=gen2 \
            --cpu=2 \
            --memory=8Gi \
            --min-instances=1 \
            --max-instances=10 \
            --cpu-throttling \
            --concurrency=100 \
            --no-allow-unauthenticated \
            --port=8080 \
            --quiet
          
          echo "✅ Deployment complete!"
          
          # Route 100% of traffic to the newly deployed revision
          echo "🔄 Routing traffic to latest revision..."
          gcloud run services update-traffic arrow-rag-backend \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region=us-central1 \
            --to-latest \
            --quiet
          
          echo "✅ Traffic routed to latest revision!"

      - name: Get service URL
        id: get-service-url
        run: |
          SERVICE_URL=$(gcloud run services describe arrow-rag-backend \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Backend deployed successfully!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Grant frontend service account access to backend
        run: |
          echo "🔐 Granting frontend service account permission to invoke backend..."
          
          # Grant the WIF service account (used by frontend) permission to invoke the backend
          gcloud run services add-iam-policy-binding arrow-rag-backend \
            --platform=managed \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --role=roles/run.invoker \
            --quiet
          
          echo "✅ Frontend service account granted permission to invoke backend"

      - name: Debug gcloud auth state before token generation
        run: |
          echo "=== Current environment variables ==="
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}'"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS}'"
          echo "GOOGLE_GHA_CREDS_PATH='${GOOGLE_GHA_CREDS_PATH}'"
          echo ""
          echo "=== gcloud auth list ==="
          gcloud auth list
          echo ""
          echo "=== gcloud config credential_file_override ==="
          gcloud config get-value auth/credential_file_override || echo "(unset)"

      - name: Force clear credential overrides before token generation
        run: |
          echo "🧹 Forcefully clearing credential override env vars..."
          # Unset in current shell and export empty
          export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=""
          export GOOGLE_APPLICATION_CREDENTIALS=""
          export GOOGLE_GHA_CREDS_PATH=""
          # Write to GITHUB_ENV to override for subsequent steps
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> $GITHUB_ENV
          echo "GOOGLE_GHA_CREDS_PATH=" >> $GITHUB_ENV
          # Verify they're actually empty
          echo "After clearing - verifying:"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}'"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS}'"
          if [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}" ]; then
            echo "⚠️ WARNING: CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE is still set!"
          fi

      - name: Generate Cloud Run Identity Token (WIF → ID token)
        id: mint_token
        run: |
          BACKEND_URL="${{ steps.get-service-url.outputs.service_url }}"
          
          echo "🔐 Generating identity token for $BACKEND_URL..."
          
          # Find the credentials file that auth@v2 created
          CREDS_FILE=$(ls gha-creds-*.json 2>/dev/null | head -1)
          
          if [ -z "$CREDS_FILE" ]; then
            echo "❌ No credentials file found from auth@v2"
            echo "Current gcloud auth state:"
            gcloud auth list
            exit 1
          fi
          
          echo "Using federated credentials file: $CREDS_FILE"
          echo ""
          echo "The credentials file contains an external_account with service account impersonation."
          echo "Using Python's google-auth library to generate identity token..."
          
          # Set credentials file as application default credentials
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/$CREDS_FILE"
          export BACKEND_URL
          
          # Use Python to call IAM Credentials API directly
          # Get OIDC token from GitHub, exchange for access token, then generate identity token
          ID_TOKEN=$(python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import requests
          
          # Set timeouts for all requests
          REQUEST_TIMEOUT = 30
          
          try:
              print("Step 1: Loading configuration...", file=sys.stderr)
              backend_url = os.environ.get('BACKEND_URL')
              creds_file = os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
              oidc_request_url = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL', '')
              oidc_request_token = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')
              
              if not backend_url or not creds_file:
                  print("ERROR: BACKEND_URL or GOOGLE_APPLICATION_CREDENTIALS not set", file=sys.stderr)
                  sys.exit(1)
              
              print(f"Step 2: Loading credentials file: {creds_file}", file=sys.stderr)
              # Load credentials file as JSON
              with open(creds_file, 'r') as f:
                  creds_info = json.load(f)
              
              print("Step 3: Extracting service account email...", file=sys.stderr)
              # Get service account email from impersonation URL
              impersonation_url = creds_info.get('service_account_impersonation_url', '')
              if '/serviceAccounts/' in impersonation_url:
                  sa_email = impersonation_url.split('/serviceAccounts/')[-1].split(':')[0]
                  print(f"Service account: {sa_email}", file=sys.stderr)
              else:
                  print("ERROR: Could not find service account in impersonation URL", file=sys.stderr)
                  sys.exit(1)
              
              print("Step 4: Getting OIDC token from GitHub...", file=sys.stderr)
              # Get the audience from credentials file (this is the WIF provider audience)
              wif_audience = creds_info.get('audience', '')
              credential_source = creds_info.get('credential_source', {})
              credential_source_url = credential_source.get('url', '')
              
              # Check if credential_source URL already has an audience parameter
              # If so, extract it to see what format it uses
              if 'audience=' in credential_source_url:
                  # Extract existing audience from URL
                  match = re.search(r'audience=([^&]*)', credential_source_url)
                  if match:
                      existing_audience = urllib.parse.unquote(match.group(1))
                      print(f"Found existing audience in credential_source URL: {existing_audience[:50]}...", file=sys.stderr)
                      # Use the existing audience format from the URL (it's already URL-encoded in the URL)
                      use_audience = existing_audience
                  else:
                      use_audience = wif_audience
              else:
                  use_audience = wif_audience
              
              print(f"Using audience: {use_audience[:50]}...", file=sys.stderr)
              
              # Get OIDC token from GitHub Actions with the correct audience
              # Prefer using credential_source URL since it has the correct format
              if credential_source_url and credential_source_url.startswith('http'):
                  # Use the credential_source URL directly - it already has the correct audience
                  oidc_url = credential_source_url
                  oidc_headers = credential_source.get('headers', {})
                  print("Using credential_source URL directly (has correct audience format)", file=sys.stderr)
              elif oidc_request_url and oidc_request_token:
                  # Request OIDC token with the WIF audience as a parameter
                  oidc_headers = {'Authorization': f'Bearer {oidc_request_token}', 'Accept': 'application/json'}
                  # URL-encode the audience and add it as a parameter
                  encoded_audience = urllib.parse.quote(use_audience, safe='')
                  if '?' in oidc_request_url:
                      oidc_url = f"{oidc_request_url}&audience={encoded_audience}"
                  else:
                      oidc_url = f"{oidc_request_url}?audience={encoded_audience}"
                  print("Using ACTIONS_ID_TOKEN_REQUEST_URL with WIF audience", file=sys.stderr)
              else:
                  print("ERROR: Could not find OIDC URL", file=sys.stderr)
                  sys.exit(1)
              
              if not oidc_url:
                  print("ERROR: Could not construct OIDC URL", file=sys.stderr)
                  sys.exit(1)
              
              # Fetch OIDC token from GitHub Actions
              print(f"Requesting OIDC token from: {oidc_url[:80]}...", file=sys.stderr)
              oidc_response = requests.get(oidc_url, headers=oidc_headers, timeout=REQUEST_TIMEOUT)
              if oidc_response.status_code != 200:
                  print(f"ERROR: Failed to get OIDC token: {oidc_response.status_code}", file=sys.stderr)
                  print(f"Response: {oidc_response.text}", file=sys.stderr)
                  sys.exit(1)
              
              oidc_data = oidc_response.json()
              subject_token = oidc_data.get('value', '')  # GitHub returns {'value': 'token'}
              
              if not subject_token:
                  print("ERROR: No token in OIDC response", file=sys.stderr)
                  sys.exit(1)
              
              print("Step 5: Exchanging OIDC token for GCP access token...", file=sys.stderr)
              # Exchange OIDC token for GCP access token via STS
              sts_url = creds_info.get('token_url', 'https://sts.googleapis.com/v1/token')
              sts_payload = {
                  'grant_type': 'urn:ietf:params:oauth:grant-type:token-exchange',
                  'subject_token': subject_token,
                  'subject_token_type': creds_info.get('subject_token_type', 'urn:ietf:params:oauth:token-type:jwt'),
                  'audience': creds_info.get('audience', ''),
                  'requested_token_type': 'urn:ietf:params:oauth:token-type:access_token',
                  'scope': 'https://www.googleapis.com/auth/cloud-platform'
              }
              
              sts_response = requests.post(sts_url, data=sts_payload, timeout=REQUEST_TIMEOUT)
              if sts_response.status_code != 200:
                  print(f"ERROR: STS token exchange failed: {sts_response.status_code}", file=sys.stderr)
                  print(f"Response: {sts_response.text}", file=sys.stderr)
                  sys.exit(1)
              
              sts_data = sts_response.json()
              access_token = sts_data.get('access_token', '')
              
              if not access_token:
                  print("ERROR: No access token in STS response", file=sys.stderr)
                  print(f"Response: {sts_data}", file=sys.stderr)
                  sys.exit(1)
              
              print("Step 6: Generating identity token via IAM API...", file=sys.stderr)
              # Now use access token to call IAM API for identity token
              api_url = f"https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{sa_email}:generateIdToken"
              
              headers = {
                  'Authorization': f'Bearer {access_token}',
                  'Content-Type': 'application/json'
              }
              
              payload = {
                  'audience': backend_url,
                  'includeEmail': True
              }
              
              response = requests.post(api_url, headers=headers, json=payload, timeout=REQUEST_TIMEOUT)
              
              if response.status_code != 200:
                  print(f"ERROR: IAM API returned status {response.status_code}", file=sys.stderr)
                  print(f"Response: {response.text}", file=sys.stderr)
                  sys.exit(1)
              
              result = response.json()
              token = result.get('token')
              
              if not token:
                  print("ERROR: No token in API response", file=sys.stderr)
                  print(f"Response: {result}", file=sys.stderr)
                  sys.exit(1)
              
              print("Step 7: Success! Identity token generated.", file=sys.stderr)
              print(token)
          except requests.exceptions.Timeout:
              print("ERROR: Request timed out", file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"ERROR: {str(e)}", file=sys.stderr)
              import traceback
              traceback.print_exc(file=sys.stderr)
              sys.exit(1)
          PYTHON_SCRIPT
          )
          
          # Validate the token
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ] || [[ "$ID_TOKEN" == *"ERROR"* ]]; then
            echo "❌ Failed to generate identity token"
            echo "Output: $ID_TOKEN"
            exit 1
          fi
          
          # Verify it looks like a JWT token (starts with eyJ)
          if [[ ! "$ID_TOKEN" =~ ^eyJ ]]; then
            echo "❌ Generated token doesn't look like a valid JWT"
            echo "Token preview: ${ID_TOKEN:0:50}..."
            exit 1
          fi
          
          echo "ID_TOKEN=$ID_TOKEN" >> $GITHUB_ENV
          echo "✅ Identity token generated successfully (length: ${#ID_TOKEN} chars)"

      - name: Verify backend health
        run: |
          BACKEND_URL="${{ steps.get-service-url.outputs.service_url }}"
          echo "🏥 Verifying backend health at $BACKEND_URL..."
          echo "⏳ Will keep trying every second for up to 5 minutes..."
          
          # Generate identity token once
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "🔐 Generating identity token for health check..."
            ID_TOKEN=$(gcloud auth print-identity-token --audiences="$BACKEND_URL" 2>/dev/null || echo "")
            if [ -z "$ID_TOKEN" ]; then
              echo "❌ Failed to generate identity token"
              exit 1
            fi
          fi
          
          # Keep trying every second for up to 5 minutes (300 seconds)
          MAX_WAIT_SECONDS=300
          START_TIME=$(date +%s)
          ATTEMPT=0
          SUCCESS=false
          
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            ELAPSED=$(($(date +%s) - START_TIME))
            REMAINING=$((MAX_WAIT_SECONDS - ELAPSED))
            
            # Check if we've exceeded the timeout
            if [ $ELAPSED -ge $MAX_WAIT_SECONDS ]; then
              echo ""
              echo "❌ Backend health check failed after 5 minutes"
              echo "Last response:"
              cat /tmp/health_response.json 2>/dev/null || echo "(no response captured)"
              echo ""
              echo "This may indicate:"
              echo "  - Service is unhealthy (check Cloud Run logs)"
              echo "  - Authentication issue (check IAM permissions)"
              echo "  - Service failed to start"
              exit 1
            fi
            
            # Try health check
            if curl -f -sS --max-time 5 -H "Authorization: Bearer $ID_TOKEN" "$BACKEND_URL/health" > /tmp/health_response.json 2>&1; then
              echo ""
              echo "✅ Backend health check passed after ${ELAPSED} seconds!"
              cat /tmp/health_response.json | jq '.' || cat /tmp/health_response.json
              SUCCESS=true
              break
            else
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 -H "Authorization: Bearer $ID_TOKEN" "$BACKEND_URL/health" 2>/dev/null || echo "000")
              
              # Only print status every 10 attempts to reduce noise
              if [ $((ATTEMPT % 10)) -eq 0 ]; then
                echo "⏳ Still waiting... (${ELAPSED}s elapsed, ${REMAINING}s remaining, HTTP $HTTP_CODE)"
              fi
              
              # Wait 1 second before next attempt
              sleep 1
            fi
          done

      - name: Pre-warm Backend Service
        continue-on-error: true
        run: |
          BACKEND_URL="${{ steps.get-service-url.outputs.service_url }}"
          
          echo "🔥 Pre-warming backend service..."
          
          # Use the identity token from the mint_token step (already in GITHUB_ENV)
          # If not available, generate a new one using gcloud auth print-identity-token
          # Auth step already impersonates the service account, so no need for --impersonate-service-account
          if [ -z "$ID_TOKEN" ]; then
            echo "🔐 Generating identity token for pre-warm..."
            ID_TOKEN=$(gcloud auth print-identity-token --audiences="$BACKEND_URL")
          fi
          
          # Verify ID_TOKEN is set and not empty
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "❌ ERROR: ID_TOKEN is empty or null!"
            echo "Cannot proceed with pre-warm without authentication token."
            exit 1
          fi
          
          # Set authorization header - MUST be "Authorization: Bearer <token>"
          AUTH_HEADER="Authorization: Bearer $ID_TOKEN"
          
          # Debug: Verify header format (mask token for security)
          echo "🔐 Authorization header configured (token length: ${#ID_TOKEN} chars)"
          
          echo "⏳ Waiting 5 seconds..."
          sleep 5
          
          echo "🏥 Checking /health..."
          HEALTH=$(curl -sS -H "$AUTH_HEADER" "$BACKEND_URL/health" || echo "ERROR")
          echo "Health: $HEALTH"
          
          echo "⏳ Waiting 10 seconds for RAG..."
          sleep 10
          
          echo "🧠 Checking RAG status..."
          STATUS=$(curl -sS -H "$AUTH_HEADER" "$BACKEND_URL/rag/status" || echo "ERROR")
          echo "RAG Status: $STATUS"
          
          echo ""
          echo "🔍 Validating index files (diagnostic)..."
          VALIDATION=$(curl -sS -H "$AUTH_HEADER" "$BACKEND_URL/rag/validate-index" || echo "ERROR")
          echo "Index Validation: $VALIDATION" | jq '.' || echo "$VALIDATION"
          
          # Check if files are corrupted
          CORRUPTED_FILES=$(echo "$VALIDATION" | jq -r '.corrupted_files[]?' 2>/dev/null || echo "")
          if [ -n "$CORRUPTED_FILES" ]; then
            echo ""
            echo "❌ CORRUPTED INDEX FILES DETECTED:"
            echo "$CORRUPTED_FILES" | while read -r file; do
              echo "  - $file"
            done
            echo ""
            echo "⚠️  Files are corrupted or missing. Check the validation output above for details."
            echo "    To fix: Re-upload a valid index from your local machine using:"
            echo "    python -m backend.scripts.upload_index_to_gcs --dir latest_model --bucket arrow-rag-support-prod-rag"
            echo ""
          fi
          
          echo ""
          echo "🧪 Running self-test..."
          SELF=$(curl -sS -H "$AUTH_HEADER" "$BACKEND_URL/rag/self-test" || echo "ERROR")
          echo "Self test: $SELF"
          
          if echo "$SELF" | grep -q '"status":"ok"'; then
            echo "✅ RAG self-test passed! RAG is fully operational."
          else
            echo "⚠️ RAG self-test did not pass. Check backend logs for details."
          fi
          
          echo "✅ Pre-warm complete!"

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: [frontend-build, gcp-auth-check]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear credential override env vars (safe version)
        run: |
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true

      - name: Clear old gcloud auth
        run: rm -rf ~/.config/gcloud

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
        id: auth

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Force clear credential overrides after setup-gcloud
        run: |
          echo "🧹 Force clearing credential overrides (setup-gcloud may have set them)..."
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> $GITHUB_ENV
          echo "GOOGLE_GHA_CREDS_PATH=" >> $GITHUB_ENV
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true
          echo "✅ Credential overrides force-cleared"

      - name: Inject project ID
        run: echo "CLOUDSDK_CORE_PROJECT=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker us-central1-docker.pkg.dev

      - name: Authenticate Docker with Artifact Registry
        run: |
          echo "Authenticating Docker with Artifact Registry using service account impersonation..."
          # gcloud auth print-access-token now uses the impersonated service account
          # No credential file override needed - service account impersonation is active
          gcloud auth print-access-token --project=${{ secrets.GCP_PROJECT_ID }} | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
          echo "Docker authentication successful"

      - name: Set up Docker Buildx
        id: buildx-frontend
        uses: docker/setup-buildx-action@v3

      - name: Verify backend URL before Docker build
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "❌ NEXT_PUBLIC_API_URL is not set!"
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_API_URL verified: $NEXT_PUBLIC_API_URL"

      - name: Build & Push Frontend Image (attempt 1)
        id: build-frontend
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx-frontend.outputs.name }}
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-frontend/frontend:${{ github.sha }}
          platforms: linux/amd64
          target: production
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            SESSION_SECRET=BUILD_PLACEHOLDER_SESSION_SECRET_SET_AT_RUNTIME_IN_CLOUD_RUN

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & Push Frontend Image (retry)
        if: steps.build-frontend.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx-frontend.outputs.name }}
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-frontend/frontend:${{ github.sha }}
          platforms: linux/amd64
          target: production
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            SESSION_SECRET=BUILD_PLACEHOLDER_SESSION_SECRET_SET_AT_RUNTIME_IN_CLOUD_RUN

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Fetch backend URL
        id: backend_url
        run: |
          URL=$(gcloud run services describe arrow-rag-backend \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          echo "🌐 Backend URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy arrow-rag-frontend \
            --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/arrow-rag-frontend/frontend:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --concurrency=80 \
            --port=3000 \
            --set-env-vars="NEXT_PUBLIC_API_URL=${{ steps.backend_url.outputs.url }}" \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="SESSION_SECRET=${{ secrets.FRONTEND_SESSION_SECRET }}" \
            --allow-unauthenticated \
            --quiet

      - name: Get service URL
        id: get-service-url
        run: |
          SERVICE_URL=$(gcloud run services describe arrow-rag-frontend \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Verify frontend → backend connection
        run: |
          FRONTEND_URL="${{ steps.get-service-url.outputs.service_url }}"
          echo "🔍 Verifying frontend → backend connection..."
          echo "Frontend URL: $FRONTEND_URL"
          
          echo "⏳ Waiting 5 seconds for frontend to be ready..."
          sleep 5
          
          if ! curl -f "$FRONTEND_URL/api/rag/status"; then
            echo "❌ Frontend → backend connection verification failed!"
            exit 1
          fi
          echo "✅ Frontend → backend connection verified"

