version: '3.8'

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Session Secret - MUST be set in production
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-random-string-at-least-32-characters-long}
      # Node Environment
      NODE_ENV: production
      # Backend API URL (if you have a separate backend)
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

