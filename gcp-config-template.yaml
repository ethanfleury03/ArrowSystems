# Google Cloud Configuration Template
# Copy this file to gcp-config.yaml and fill in your actual values

# Your Google Cloud Project Details
project:
  id: "YOUR_PROJECT_ID"                    # e.g., "my-rag-app-123456"
  region: "us-central1"                    # e.g., "us-central1", "us-east1", "europe-west1"
  zone: "us-central1-a"                     # e.g., "us-central1-a"

# Cloud Run Service Configuration
service:
  name: "rag-app"                          # Your Cloud Run service name
  port: 8501                               # Streamlit default port
  memory: "4Gi"                            # Memory allocation
  cpu: "2"                                 # CPU allocation
  min_instances: 0                          # Minimum running instances
  max_instances: 10                        # Maximum running instances
  timeout: 3600                            # Request timeout in seconds

# Storage Buckets (update these to match your existing buckets)
buckets:
  data: "YOUR_PROJECT_ID-rag-data"         # Bucket for PDFs and documents
  models: "YOUR_PROJECT_ID-rag-models"     # Bucket for ML models and indices
  logs: "YOUR_PROJECT_ID-rag-logs"         # Bucket for application logs

# Secret Manager Secrets (update these to match your existing secrets)
secrets:
  anthropic_api_key: "anthropic-api-key"    # Your Anthropic API key secret name
  openai_api_key: "openai-api-key"         # Your OpenAI API key secret name
  aws_access_key: "aws-access-key"         # Your AWS access key secret name
  aws_secret_key: "aws-secret-key"         # Your AWS secret key secret name

# Environment Variables
environment:
  python_path: "/app"
  log_level: "INFO"
  debug: "false"

# Build Configuration
build:
  machine_type: "E2_HIGHCPU_8"             # Build machine type
  disk_size_gb: 100                        # Build disk size
  timeout: "1800s"                         # Build timeout
  logging: "CLOUD_LOGGING_ONLY"            # Build logging level
