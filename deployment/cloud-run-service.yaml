apiVersion: run.googleapis.com/v2
kind: Service
metadata:
  name: arrow-rag-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    autoscaling.knative.dev/minScale: "1"
spec:
  template:
    spec:
      containers:
        - image: gcr.io/ragapp-476414/rag-app:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "2"
              # Increased from 4Gi → 8Gi to prevent OOM kills when loading BGE-large embedding model + 350MB dense vector index
              memory: "8Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
