services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # PostgreSQL configuration (supports both POSTGRES_* and DB_* naming)
      - POSTGRES_HOST=${POSTGRES_HOST:-${DB_HOST:-localhost}}
      - POSTGRES_PORT=${POSTGRES_PORT:-${DB_PORT:-5432}}
      - POSTGRES_USER=${POSTGRES_USER:-${DB_USER:-postgres}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:-password}}
      - POSTGRES_DB=${POSTGRES_DB:-${DB_NAME:-rag_app}}
      - DB_HOST=${DB_HOST:-${POSTGRES_HOST:-localhost}}
      - DB_PORT=${DB_PORT:-${POSTGRES_PORT:-5432}}
      - DB_USER=${DB_USER:-${POSTGRES_USER:-postgres}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:-password}}
      - DB_NAME=${DB_NAME:-${POSTGRES_DB:-rag_app}}
      - CLOUD_SQL_CONNECTION_NAME=${CLOUD_SQL_CONNECTION_NAME:-}
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./latest_model:/app/latest_model:ro
      - ./logs:/app/logs
      - ./storage:/app/storage
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    networks:
      - rag-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      # Database - Use PostgreSQL
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ragdb?schema=public}
      # Session Secret - MUST be set in production
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-random-string-at-least-32-characters-long}
      # Admin Account - Set these for initial admin user
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # Node Environment
      - NODE_ENV=production
      # Backend API URL (if you have a separate backend)
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # PostgreSQL Database for Frontend
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  hf_cache:
    driver: local
  postgres_data:
    driver: local

