services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # PostgreSQL configuration (supports both POSTGRES_* and DB_* naming)
      - POSTGRES_HOST=${POSTGRES_HOST:-${DB_HOST:-localhost}}
      - POSTGRES_PORT=${POSTGRES_PORT:-${DB_PORT:-5432}}
      - POSTGRES_USER=${POSTGRES_USER:-${DB_USER:-postgres}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:-password}}
      - POSTGRES_DB=${POSTGRES_DB:-${DB_NAME:-rag_app}}
      - DB_HOST=${DB_HOST:-${POSTGRES_HOST:-localhost}}
      - DB_PORT=${DB_PORT:-${POSTGRES_PORT:-5432}}
      - DB_USER=${DB_USER:-${POSTGRES_USER:-postgres}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:-password}}
      - DB_NAME=${DB_NAME:-${POSTGRES_DB:-rag_app}}
      - CLOUD_SQL_CONNECTION_NAME=${CLOUD_SQL_CONNECTION_NAME:-}
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./latest_model:/app/latest_model:ro
      - ./logs:/app/logs
      - ./storage:/app/storage
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    networks:
      - rag-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  hf_cache:
    driver: local

