version: '3.8'

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SQLITE_DB_PATH=/app/database.sqlite
    volumes:
      # Mount the latest_model directory if it exists locally
      - ./latest_model:/app/latest_model:ro
      # Mount logs directory for persistence
      - ./logs:/app/logs
      - ./backend/database.sqlite:/app/database.sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
