# Google Cloud Build Configuration for RAG Application
# This file defines how to build and deploy your app to Google Cloud Run
# 
# BEFORE USING: Update these variables to match your setup:
# - Replace YOUR_PROJECT_ID with your actual project ID
# - Replace YOUR_REGION with your preferred region (e.g., us-central1)
# - Update bucket names to match your existing buckets
# - Update secret names to match your Secret Manager setup

substitutions:
  _PROJECT_ID: 'ragapp-476414'             # Your actual project ID
  _REGION: 'us-central1'                    # Default region (you can change this)
  _SERVICE_NAME: 'rag-app'                  # Your Cloud Run service name
  _DATA_BUCKET: 'ragapp-data'               # Your existing data bucket
  _MODEL_BUCKET: 'ragapp-models'            # Your existing models bucket
  _LOGS_BUCKET: 'ragapp-logs'               # Your existing logs bucket

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'BUILD_ENV=production'
      - '.'
    timeout: '1200s'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8501'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '3600'
      - '--set-env-vars'
      - 'PYTHONPATH=/app'
      - '--set-env-vars'
      - 'HF_HOME=/tmp/hf,TRANSFORMERS_CACHE=/tmp/hf,SENTENCE_TRANSFORMERS_HOME=/tmp/st'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest'

# Store images in Container Registry
images:
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

# Timeout for the entire build
timeout: '1800s'
