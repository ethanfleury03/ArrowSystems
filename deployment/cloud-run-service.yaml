apiVersion: run.googleapis.com/v2
kind: Service
metadata:
  name: arrow-rag-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    autoscaling.knative.dev/minScale: "1"
spec:
  template:
    spec:
      containers:
        - image: gcr.io/ragapp-476414/rag-app:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "2"
              # Reduced from 8Gi → 4Gi after image removal (index: 1650MB → 191MB, ~88% reduction)
              # Base footprint: ~700MB (191MB index + ~500MB models). 4Gi provides ~5.7x headroom.
              # Memory sizing based on measured peak RSS from instrumentation, not estimates.
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
