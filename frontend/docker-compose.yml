version: '3.8'

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database - Use PostgreSQL in production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ragdb?schema=public}
      
      # Session Secret - MUST be set in production
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-random-string-at-least-32-characters-long}
      
      # Admin Account - Set these for initial admin user
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      
      # Node Environment
      NODE_ENV: production
      
      # Backend API URL (if you have a separate backend)
      # NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # PostgreSQL Database (optional - use external database in production)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  postgres_data:

networks:
  rag-network:
    driver: bridge

