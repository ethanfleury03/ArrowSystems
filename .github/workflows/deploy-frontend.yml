name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: arrow-rag-support-prod
  SERVICE_NAME: arrow-rag-frontend
  REGION: us-central1
  GCR_IMAGE: gcr.io/arrow-rag-support-prod/arrow-rag-frontend
  BACKEND_URL: https://arrow-rag-backend-70705019874.us-central1.run.app

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/70705019874/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@arrow-rag-support-prod.iam.gserviceaccount.com


      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.GCR_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          target: production
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://arrow-rag-backend-70705019874.us-central1.run.app
            SESSION_SECRET=BUILD_PLACEHOLDER_SESSION_SECRET_SET_AT_RUNTIME_IN_CLOUD_RUN
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCR_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars NEXT_PUBLIC_API_URL="${{ env.BACKEND_URL }}" \
            --set-env-vars NODE_ENV=production \
            --set-env-vars SESSION_SECRET=${{ secrets.FRONTEND_SESSION_SECRET }} \
            --allow-unauthenticated \
            --quiet

      - name: Get service URL
        id: get-service-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "## 🚀 Frontend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.GCR_IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.get-service-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY

