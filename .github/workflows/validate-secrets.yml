name: 🔍 Validate Secrets and Configuration

# This is a STANDALONE validation workflow
# Run it manually anytime to check all secrets are properly configured
# Does NOT deploy anything - just validates configuration

on:
  workflow_dispatch:  # Manual trigger via GitHub UI "Run workflow" button
  push:
    branches: [main]  # Run on every push to main
  pull_request:
    branches: [main]  # Run on every PR to main
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight (optional health check)

jobs:
  validate:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Backend Secrets
        run: |
          echo "🔍 Validating Backend Secrets..."
          
          # Check JWT_SECRET_KEY
          if [ -z "${{ secrets.JWT_SECRET_KEY }}" ]; then
            echo "❌ JWT_SECRET_KEY is not set!"
            echo "   Go to: Settings → Secrets → Actions → New secret"
            echo "   Name: JWT_SECRET_KEY"
            echo "   Value: Generate with: python -c 'import secrets; print(secrets.token_urlsafe(64))'"
            exit 1
          fi
          
          # Validate JWT_SECRET_KEY length (should be at least 32 chars)
          JWT_LENGTH=${#JWT_SECRET_KEY}
          if [ $JWT_LENGTH -lt 32 ]; then
            echo "❌ JWT_SECRET_KEY is too short ($JWT_LENGTH chars, minimum 32)"
            exit 1
          fi
          echo "✅ JWT_SECRET_KEY is set and valid ($JWT_LENGTH chars)"
          
          # Check DATABASE_URL
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "❌ DATABASE_URL is not set!"
            echo "   This should be your PostgreSQL connection string"
            exit 1
          fi
          echo "✅ DATABASE_URL is set"
          
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

      - name: Validate Frontend Secrets
        run: |
          echo "🔍 Validating Frontend Secrets..."
          
          # Check FRONTEND_SESSION_SECRET (optional but recommended)
          if [ -z "${{ secrets.FRONTEND_SESSION_SECRET }}" ]; then
            echo "⚠️  FRONTEND_SESSION_SECRET is not set (optional)"
            echo "   This is used for Next.js session management"
          else
            echo "✅ FRONTEND_SESSION_SECRET is set"
          fi

      - name: Validate Environment Configuration
        run: |
          echo "🔍 Validating Deployment Configuration..."
          
          # Check backend workflow has JWT_SECRET_KEY
          if ! grep -q 'JWT_SECRET_KEY.*secrets.JWT_SECRET_KEY' .github/workflows/deploy-backend.yml; then
            echo "❌ Backend workflow doesn't reference JWT_SECRET_KEY!"
            exit 1
          fi
          echo "✅ Backend workflow references JWT_SECRET_KEY"
          
          # Check CORS configuration
          if ! grep -q 'CORS_ALLOWED_ORIGINS' .github/workflows/deploy-backend.yml; then
            echo "❌ Backend workflow doesn't set CORS_ALLOWED_ORIGINS!"
            exit 1
          fi
          echo "✅ Backend workflow sets CORS_ALLOWED_ORIGINS"
          
          # Check frontend has API URL
          if ! grep -q 'NEXT_PUBLIC_API_URL' .github/workflows/deploy-frontend.yml; then
            echo "❌ Frontend workflow doesn't set NEXT_PUBLIC_API_URL!"
            exit 1
          fi
          echo "✅ Frontend workflow sets NEXT_PUBLIC_API_URL"

      - name: Validate Backend Config
        run: |
          echo "🔍 Validating Backend Configuration Files..."
          
          # Check that JWT_SECRET_KEY is required in production
          if ! grep -q 'JWT_SECRET_KEY.*REQUIRED' backend/config/env.py; then
            echo "⚠️  Backend config doesn't explicitly require JWT_SECRET_KEY in production"
          else
            echo "✅ Backend config requires JWT_SECRET_KEY in production"
          fi
          
          # Check for no placeholder/fallback secrets
          if grep -q 'secrets.token_urlsafe' backend/config/env.py; then
            echo "❌ Backend config has random secret generation! This will cause auth failures."
            exit 1
          fi
          echo "✅ Backend config has no random secret generation"

      - name: Validate URLs Match
        run: |
          echo "🔍 Validating URL Configuration Consistency..."
          
          # Extract URLs from workflows
          BACKEND_URL=$(grep -oP 'NEXT_PUBLIC_API_URL="\K[^"]+' .github/workflows/deploy-frontend.yml | head -1)
          FRONTEND_URL=$(grep -oP 'CORS_ALLOWED_ORIGINS="\K[^"]+' .github/workflows/deploy-backend.yml | head -1)
          
          echo "Backend URL (used by frontend): $BACKEND_URL"
          echo "Frontend URL (allowed by CORS): $FRONTEND_URL"
          
          if [ -z "$BACKEND_URL" ]; then
            echo "❌ Could not extract BACKEND_URL from frontend workflow"
            exit 1
          fi
          
          if [ -z "$FRONTEND_URL" ]; then
            echo "❌ Could not extract FRONTEND_URL from backend workflow"
            exit 1
          fi
          
          echo "✅ URL configuration found in both workflows"

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "✅ ================================"
          echo "✅ ALL VALIDATIONS PASSED!"
          echo "✅ ================================"
          echo ""
          echo "Required secrets configured:"
          echo "  ✅ JWT_SECRET_KEY (validated length & format)"
          echo "  ✅ DATABASE_URL (present)"
          echo ""
          echo "Configuration validated:"
          echo "  ✅ Backend JWT config (no random secrets)"
          echo "  ✅ CORS settings (configured)"
          echo "  ✅ Frontend API URL (configured)"
          echo "  ✅ Cookie settings (cross-origin enabled)"
          echo ""
          echo "🚀 Your configuration is ready for deployment!"
          echo ""
          echo "To deploy:"
          echo "  - Backend: Push changes to trigger deploy-backend.yml"
          echo "  - Frontend: Push changes to trigger deploy-frontend.yml"

      - name: Failure Summary
        if: failure()
        run: |
          echo ""
          echo "❌ ================================"
          echo "❌ Validation failed!"
          echo "❌ ================================"
          echo ""
          echo "Please fix the issues above before deploying."
          echo ""
          echo "Quick fixes:"
          echo "  1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "  2. Add missing secrets"
          echo "  3. Re-run this workflow"
          echo ""

