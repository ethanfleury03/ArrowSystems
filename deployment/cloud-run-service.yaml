apiVersion: run.googleapis.com/v2
kind: Service
metadata:
  name: arrow-rag-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    autoscaling.knative.dev/minScale: "1"
spec:
  template:
    spec:
      containers:
        - image: gcr.io/ragapp-476414/rag-app:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "2"
              # CRITICAL: 8GiB memory is REQUIRED to prevent OOM/SIGKILL
              # Base footprint: ~2-3GB (models) + ~200MB (index) + ~1GB (Python/runtime) = ~4-5GB
              # 8GiB provides headroom for memory spikes during model loading and vector store parsing
              # Previous 4GiB caused repeated SIGKILL errors and worker restarts
              # DO NOT reduce this without extensive load testing and memory profiling
              memory: "8Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
