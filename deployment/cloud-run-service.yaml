apiVersion: run.googleapis.com/v2
kind: Service
metadata:
  name: arrow-rag-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    spec:
      containers:
        - image: gcr.io/ragapp-476414/rag-app:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "2"
              memory: "8Gi"
          volumeMounts:
            - name: rag-index
              mountPath: /app/latest_model
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: rag-index
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: arrow-rag-support-prod-rag
