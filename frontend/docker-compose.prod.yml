version: '3.8'

# Production Docker Compose configuration
# Use this for production deployments with external PostgreSQL

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database - MUST be set to your production PostgreSQL URL
      DATABASE_URL: ${DATABASE_URL}
      
      # Session Secret - MUST be set (generate a secure random string)
      SESSION_SECRET: ${SESSION_SECRET}
      
      # Admin Account - MUST be set for production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      
      # Node Environment
      NODE_ENV: production
    restart: unless-stopped
    # Remove depends_on if using external PostgreSQL
    # depends_on:
    #   postgres:
    #     condition: service_healthy

