apiVersion: run.googleapis.com/v2
kind: Service
metadata:
  name: arrow-rag-backend
spec:
  template:
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 10

    containers:
      - image: gcr.io/ragapp-476414/rag-app:latest
        ports:
          - containerPort: 8080

        env:
          - name: PYTHONPATH
            value: "/app"
          - name: PORT
            value: "8080"

        resources:
          # Match your old YAML: 2 CPUs, 8Gi memory
          cpuIdle: false
          limits:
            cpu: "2"
            memory: "8Gi"

        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
          - name: rag-index-volume
            mountPath: /app/latest_model
            readOnly: true
          - name: data-volume
            mountPath: /app/data
            readOnly: true

    volumes:
      - name: rag-index-volume
        gcs:
          bucket: arrow-rag-support-prod-rag

      - name: data-volume
        gcs:
          bucket: ragapp-data
