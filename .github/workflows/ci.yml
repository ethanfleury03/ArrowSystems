name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Backend tests are temporarily disabled until a real test suite is written
  backend-tests:
    name: Backend Tests
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: |
          pytest --maxfail=1 --disable-warnings -q
        env:
          ENV: dev
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use
          CORS_ALLOWED_ORIGINS: http://localhost:3000

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js application
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000
          SESSION_SECRET: test-session-secret-for-ci-only-not-for-production-use-at-least-32-chars

      - name: Verify build artifacts
        working-directory: ./frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "Error: .next directory not found after build"
            exit 1
          fi
          echo "✅ Build artifacts verified"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify build context
        run: |
          echo "=== Checking build context ==="
          ls -la
          echo "=== Checking Dockerfile exists ==="
          test -f ./backend/Dockerfile.backend && echo "✅ Dockerfile found" || echo "❌ Dockerfile not found"
          echo "=== Checking backend directory ==="
          ls -la backend/ | head -20

      - name: Build backend Docker image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.backend
          push: false
          tags: duraflex-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production

      - name: Verify backend image was created
        run: |
          echo "=== Checking for backend image immediately after build ==="
          docker images | head -10
          if docker images | grep -q duraflex-backend:ci; then
            echo "✅ Backend image found after build"
            docker images | grep duraflex-backend:ci
          else
            echo "❌ Backend image NOT found after build"
            echo "=== All images ==="
            docker images
            exit 1
          fi

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: duraflex-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64
          target: production
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://arrow-rag-backend-70705019874.us-central1.run.app
            SESSION_SECRET=BUILD_PLACEHOLDER_SESSION_SECRET_SET_AT_RUNTIME_IN_CLOUD_RUN

      - name: List all Docker images (debug)
        if: failure()
        run: |
          echo "=== All Docker images ==="
          docker images
          echo "=== Images with 'duraflex' in name ==="
          docker images | grep duraflex || echo "No images found with 'duraflex' in name"

      - name: Verify Docker images
        run: |
          echo "Checking for built Docker images..."
          if docker images | grep -q duraflex-backend:ci; then
            echo "✅ Backend image found"
            docker images | grep duraflex-backend:ci
          else
            echo "❌ Backend image not found"
            exit 1
          fi
          if docker images | grep -q duraflex-frontend:ci; then
            echo "✅ Frontend image found"
            docker images | grep duraflex-frontend:ci
          else
            echo "❌ Frontend image not found"
            exit 1
          fi
          echo "✅ All Docker images built successfully"

  lint:
    name: Lint (Placeholder)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Linting placeholder
        run: |
          echo "⚠️  Linting placeholder - ruff/black/tsc coming later"
          echo "✅ Lint job completed (placeholder)"

