services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SQLITE_DB_PATH=/app/database.sqlite
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
      - SEED_TECH_EMAIL=${SEED_TECH_EMAIL:-}
      - SEED_TECH_PASSWORD=${SEED_TECH_PASSWORD:-}
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./latest_model:/app/latest_model:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./storage:/app/storage
      - hf_cache:/app/.cache/huggingface
      - ./backend/database.sqlite:/app/database.sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    networks:
      - rag-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      # Session Secret - MUST be set in production
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-random-string-at-least-32-characters-long}
      # Admin Account - Set these for initial admin user
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # Node Environment
      - NODE_ENV=production
      # Backend API URL (if you have a separate backend)
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_USE_LOCAL_BACKEND=true
      - NEXT_PUBLIC_LOCAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SERVER_BACKEND_URL=http://backend:8000
      - SERVER_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  hf_cache:
    driver: local
