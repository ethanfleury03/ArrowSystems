name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  validate-secrets:
    name: 🔍 Validate Secrets & Config
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Backend Secrets
        run: |
          echo "🔍 Validating Backend Secrets..."
          
          # Check JWT_SECRET_KEY
          if [ -z "${{ secrets.JWT_SECRET_KEY }}" ]; then
            echo "❌ JWT_SECRET_KEY is not set!"
            echo "   📝 Add it at: Settings → Secrets → Actions"
            echo "   🔐 Generate: python -c 'import secrets; print(secrets.token_urlsafe(64))'"
            exit 1
          fi
          echo "✅ JWT_SECRET_KEY is set"
          
          # Check DATABASE_URL
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "❌ DATABASE_URL is not set!"
            exit 1
          fi
          echo "✅ DATABASE_URL is set"

      - name: Validate Config Files
        run: |
          echo "🔍 Validating Configuration..."
          
          # Check no random secret ASSIGNMENT (ignore comments/error messages)
          if grep -E '=.*secrets\.token_urlsafe' backend/config/env.py; then
            echo "❌ Backend has random secret generation!"
            exit 1
          fi
          echo "✅ No random secret generation"
          
          # Check JWT_SECRET_KEY is required in prod
          if grep -q 'JWT_SECRET_KEY.*REQUIRED' backend/config/env.py; then
            echo "✅ JWT_SECRET_KEY required in production"
          fi

      - name: Validate Deployment Configuration
        run: |
          echo "🔍 Validating Deployment Configuration..."
          
          # Check CI workflow has JWT secret for backend deployment
          if ! grep -q 'JWT_SECRET_KEY.*secrets.JWT_SECRET_KEY' .github/workflows/ci.yml; then
            echo "❌ CI workflow missing JWT_SECRET_KEY!"
            exit 1
          fi
          echo "✅ Backend deployment configured with JWT_SECRET_KEY"
          
          # Check CI workflow has API URL for frontend
          if ! grep -q 'NEXT_PUBLIC_API_URL' .github/workflows/ci.yml; then
            echo "❌ CI workflow missing API URL!"
            exit 1
          fi
          echo "✅ Frontend deployment configured with API URL"
          
          echo ""
          echo "✅ All secrets and configuration validated!"

  # Backend tests are temporarily disabled until a real test suite is written
  backend-tests:
    name: Backend Tests
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: |
          pytest --maxfail=1 --disable-warnings -q
        env:
          ENV: dev
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use
          CORS_ALLOWED_ORIGINS: http://localhost:3000

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js application
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000
          SESSION_SECRET: test-session-secret-for-ci-only-not-for-production-use-at-least-32-chars

      - name: Verify build artifacts
        working-directory: ./frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "Error: .next directory not found after build"
            exit 1
          fi
          echo "✅ Build artifacts verified"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify build context
        run: |
          echo "=== Checking build context ==="
          ls -la
          echo "=== Checking Dockerfile exists ==="
          test -f ./backend/Dockerfile.backend && echo "✅ Dockerfile found" || echo "❌ Dockerfile not found"
          echo "=== Checking backend directory ==="
          ls -la backend/ | head -20
          echo "=== Checking buildx builder ==="
          docker buildx ls

      - name: Build backend Docker image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.backend
          push: false
          tags: duraflex-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: duraflex-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64
          target: production
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://arrow-rag-backend-70705019874.us-central1.run.app
            SESSION_SECRET=BUILD_PLACEHOLDER_SESSION_SECRET_SET_AT_RUNTIME_IN_CLOUD_RUN

  gcp-auth-check:
    name: Validate GCP Authentication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/70705019874/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@arrow-rag-support-prod.iam.gserviceaccount.com


      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate service account authentication
        run: |
          echo "Checking GCP auth..."
          gcloud auth list

      - name: Validate project access
        run: |
          gcloud config set project arrow-rag-support-prod
          gcloud projects describe arrow-rag-support-prod

      - name: Validate Artifact Registry access
        run: |
          gcloud artifacts repositories list \
            --project=arrow-rag-support-prod \
            --location=us-central1

      - name: Validate Cloud Run access
        run: |
          gcloud run services list \
            --platform=managed \
            --region=us-central1

      - name: Validate Cloud SQL access
        run: |
          gcloud sql instances list --project=arrow-rag-support-prod

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [docker-build, gcp-auth-check]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/70705019874/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@arrow-rag-support-prod.iam.gserviceaccount.com


      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: arrow-rag-support-prod

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker us-central1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.backend
          push: true
          tags: us-central1-docker.pkg.dev/arrow-rag-support-prod/arrow-rag-backend/backend:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            BUILD_ENV=production
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy arrow-rag-backend \
            --image=us-central1-docker.pkg.dev/arrow-rag-support-prod/arrow-rag-backend/backend:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --memory=8Gi \
            --cpu=2 \
            --timeout=900 \
            --concurrency=80 \
            --cpu-boost \
            --set-cloudsql-instances=arrow-rag-support-prod:us-central1:rag-postgres \
            --set-env-vars=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --set-env-vars=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --set-env-vars=HF_HOME=/app/.cache/huggingface \
            --set-env-vars=TRANSFORMERS_CACHE=/app/.cache/huggingface \
            --set-env-vars=SENTENCE_TRANSFORMERS_HOME=/app/.cache/huggingface \
            --set-env-vars=ENABLE_INGESTION_ON_STARTUP=false \
            --set-env-vars=PYTHONUNBUFFERED=1 \
            --set-env-vars=ENV=prod \
            --set-env-vars=CORS_ALLOWED_ORIGINS="https://arrow-rag-frontend-70705019874.us-central1.run.app" \
            --set-env-vars=AUTH_COOKIE_SAMESITE=none \
            --set-env-vars=AUTH_COOKIE_SECURE=true \
            --allow-unauthenticated \
            --quiet

      - name: Get service URL
        id: get-service-url
        run: |
          SERVICE_URL=$(gcloud run services describe arrow-rag-backend \
            --region=us-central1 \
            --format='value(status.url)')
          echo "✅ Backend deployed successfully!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: [frontend-build, gcp-auth-check]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/70705019874/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@arrow-rag-support-prod.iam.gserviceaccount.com


      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: arrow-rag-support-prod

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker us-central1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/arrow-rag-support-prod/arrow-rag-frontend/frontend:${{ github.sha }}
          platforms: linux/amd64
          target: production
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://arrow-rag-backend-70705019874.us-central1.run.app
            SESSION_SECRET=BUILD_PLACEHOLDER_SESSION_SECRET_SET_AT_RUNTIME_IN_CLOUD_RUN
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy arrow-rag-frontend \
            --image=us-central1-docker.pkg.dev/arrow-rag-support-prod/arrow-rag-frontend/frontend:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --concurrency=80 \
            --port=3000 \
            --set-env-vars=NEXT_PUBLIC_API_URL=https://arrow-rag-backend-70705019874.us-central1.run.app \
            --set-env-vars=NODE_ENV=production \
            --set-env-vars=SESSION_SECRET="${{ secrets.FRONTEND_SESSION_SECRET }}" \
            --allow-unauthenticated \
            --quiet

      - name: Get service URL
        id: get-service-url
        run: |
          SERVICE_URL=$(gcloud run services describe arrow-rag-frontend \
            --region=us-central1 \
            --format='value(status.url)')
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

  lint:
    name: Lint (Placeholder)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Linting placeholder
        run: |
          echo "⚠️  Linting placeholder - ruff/black/tsc coming later"
          echo "✅ Lint job completed (placeholder)"

