# DEPRECATED — use docker-compose.dev.yml or docker-compose.prod.yml instead.
# This file is kept for backward compatibility but should not be used for new deployments.

version: '3.8'

# Production Docker Compose configuration
# Uses the backend FastAPI service for persistence (SQLite)

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Session Secret - MUST be set (generate a secure random string)
      SESSION_SECRET: ${SESSION_SECRET}
      # Node Environment
      NODE_ENV: production
      # Backend API URL
      BACKEND_URL: ${BACKEND_URL}
    restart: unless-stopped

